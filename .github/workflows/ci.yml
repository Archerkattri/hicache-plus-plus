name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: CPU self-tests (no GPU, no model)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch + package)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy
          pip install -e .
      - name: Run CPU test suite
        # tests/run_tests.py exercises the hermite/dmd/tree module self-tests plus
        # the DiT-harness forecast + checkpoint tests on CPU (no GPU, no model).
        run: python tests/run_tests.py
