<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 445" role="img" aria-labelledby="title desc">
  <title id="title">HiCache++ runtime decision path</title>
  <desc id="desc">Model-family policy, immutable budget, held-out audit, and full-compute fallback share one ledger.</desc>
  <rect width="1200" height="445" rx="22" fill="#020617"/>
  <defs>
