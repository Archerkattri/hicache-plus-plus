  <path class="line" d="M405 190L480 140"/>
  <g transform="translate(480 100)"><rect class="box" width="175" height="75" rx="12" stroke="#22c55e"/><text class="t" x="87.5" y="32.5" text-anchor="middle" font-size="14" font-weight="700">Flow matching</text><text class="m muted" x="87.5" y="55.5" text-anchor="middle" font-size="11">DMD / Prony</text></g>
  <path class="line" d="M405 240L480 292"/>
  <g transform="translate(480 255)"><rect class="box" width="175" height="75" rx="12" stroke="#a78bfa"/><text class="t" x="87.5" y="32.5" text-anchor="middle" font-size="14" font-weight="700">DiT denoising</text><text class="m muted" x="87.5" y="55.5" text-anchor="middle" font-size="11">Hermite</text></g>
  <path class="line" d="M655 137L720 194"/>
  <path class="line" d="M655 292L720 235"/>
  <g transform="translate(720 165)"><rect class="box" width="175" height="100" rx="12" stroke="#f59e0b"/><text class="t" x="87.5" y="45" text-anchor="middle" font-size="14" font-weight="700">Budget guard</text><text class="m muted" x="87.5" y="68" text-anchor="middle" font-size="11">quality · cost · horizon</text></g>
  <path class="line" d="M895 215L945 215"/>
  <path d="M1010 155L1080 215L1010 275L945 215Z" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/><text class="t" x="1010" y="207" text-anchor="middle" font-size="13" font-weight="700">audit passes?</text><text class="m muted" x="1010" y="229" text-anchor="middle" font-size="10">held-out error</text>
