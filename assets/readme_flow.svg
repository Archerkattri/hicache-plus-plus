  <rect x="245" y="360" width="835" height="48" rx="10" fill="#0f172a" stroke="#334155"/><text class="m" x="663" y="389" text-anchor="middle" font-size="12">append-only ledger: identity · decision · error · compute · fallback · manifest digest</text>
